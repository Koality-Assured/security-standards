<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="35%" stop-color="#101522" />
      <stop offset="75%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Crimson Primary Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Fiery Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Titanium Metal Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="crimsonAuraBanner" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberAuraBanner" cx="82%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .brand-prefix {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2.5px;
        fill: #FB7185;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: #FFFFFF;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 17.5px;
        font-weight: 400;
        fill: #94A3B8;
      }
      .brand-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #64748B;
      }
      .badge-label {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .tech-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Banner Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Ambient Glow Backdrops -->
  <rect width="1200" height="380" rx="16" fill="url(#crimsonAuraBanner)" />
  <rect width="1200" height="380" rx="16" fill="url(#amberAuraBanner)" />

  <!-- Structural Background Grid & Threat Matrix Coordinate Lines -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="285" x2="1200" y2="285" />
    <line x1="160" y1="0" x2="160" y2="380" />
    <line x1="380" y1="0" x2="380" y2="380" />
    <line x1="620" y1="0" x2="620" y2="380" stroke-dasharray="4 4" />
    <line x1="880" y1="0" x2="880" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- Tech Telemetry Watermarks -->
  <g class="tech-mono" fill="#475569" opacity="0.5">
    <text x="64" y="32">DOMAINS // 20+ OPERATIONAL</text>
    <text x="320" y="32">THREAT-MODEL // STRIDE-ALIGNED</text>
    <text x="640" y="32">POLICY // FAIL-CLOSED</text>
    <text x="1050" y="32">LEVEL // L4-MAX</text>
  </g>

  <!-- LEFT COLUMN: Brand Identity & Metadata -->
  <g transform="translate(64, 52)">
    <!-- Brand Icon Container -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="62" height="62" rx="16" fill="#131A29" stroke="url(#crimsonGrad)" stroke-width="1.8" />
      <!-- Mini Shield & Lock -->
      <path d="M 31 12 C 24 14 18 16 14 19 C 13 32 12 43 31 52 C 50 43 49 32 48 19 C 44 16 38 14 31 12 Z"
            fill="#1E293B" stroke="url(#crimsonGrad)" stroke-width="1.4" />
      <path d="M 27 28 V 24 C 27 21.8 28.8 20 31 20 C 33.2 20 35 21.8 35 24 V 28"
            stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none" />
      <rect x="24" y="28" width="14" height="11" rx="2" fill="#E11D48" />
      <circle cx="31" cy="33.5" r="1.5" fill="#FEF08A" />
    </g>

    <!-- Brand Typography -->
    <text x="78" y="22" class="brand-prefix">KOALITY-ASSURED</text>
    <text x="78" y="52" class="brand-title">SECURITY STANDARDS</text>
    <text x="0" y="96" class="brand-subtitle">Normative Engineering, Architectural &amp; Operational Guardrails</text>
    
    <text x="0" y="128" class="brand-desc">Authoritative defense-in-depth specifications across 20+ operational domains,</text>
    <text x="0" y="148" class="brand-desc">machine-verifiable schemas, and deterministic AI coding agent guardrails.</text>

    <!-- Operational Capability Badges -->
    <g transform="translate(0, 185)">
      <!-- Badge 1: STRIDE Threat Model -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="146" height="30" rx="6" fill="#1E2536" stroke="#F59E0B" stroke-width="1.2" />
        <circle cx="14" cy="15" r="4" fill="#F59E0B" />
        <text x="25" y="19" class="badge-label" fill="#FEF08A">STRIDE-ALIGNED</text>
      </g>

      <!-- Badge 2: 30 Normative Specs -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="156" height="30" rx="6" fill="#1E2536" stroke="#E11D48" stroke-width="1.2" />
        <circle cx="14" cy="15" r="4" fill="#E11D48" />
        <text x="25" y="19" class="badge-label" fill="#FDA4AF">30 STANDARDS</text>
      </g>

      <!-- Badge 3: Fail-Closed -->
      <g transform="translate(322, 0)">
        <rect x="0" y="0" width="150" height="30" rx="6" fill="#1E2536" stroke="#64748B" stroke-width="1.2" />
        <circle cx="14" cy="15" r="4" fill="#10B981" />
        <text x="25" y="19" class="badge-label" fill="#E2E8F0">FAIL-CLOSED ARCH</text>
      </g>
    </g>

    <!-- Secondary Meta Pills -->
    <g transform="translate(0, 240)" class="tech-mono" fill="#64748B">
      <text x="2" y="12">IAM (SAML/SCIM/OIDC)  •  APPSEC &amp; CLOUDSEC  •  CRYPTOGRAPHY (AES-256-GCM)  •  DEFENSE-IN-DEPTH</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Defense-in-Depth Shield & STRIDE Threat Matrix Visualizer -->
  <g transform="translate(890, 190)">
    <!-- Ambient Radar Concentric Rings -->
    <circle cx="0" cy="0" r="145" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
    <circle cx="0" cy="0" r="115" stroke="#475569" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
    <circle cx="0" cy="0" r="85" stroke="#64748B" stroke-width="1" opacity="0.4" />

    <!-- Crosshair Target Axes -->
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" opacity="0.25" />
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" opacity="0.25" />

    <!-- Layer 1 (Outer Perimeter): Network & Edge Gateway Shield -->
    <path d="M 0 -92 C 54 -84 84 -74 104 -54 C 100 12 85 64 0 114 C -85 64 -100 12 -104 -54 C -84 -74 -54 -84 0 -92 Z"
          fill="#101726" stroke="#475569" stroke-width="1.5" opacity="0.9" />

    <!-- Layer 2 (Middle Boundary): Identity & Zero Trust Boundary -->
    <path d="M 0 -76 C 42 -70 66 -62 82 -46 C 78 8 66 50 0 90 C -66 50 -78 8 -82 -46 C -66 -62 -42 -70 0 -76 Z"
          fill="#172033" stroke="url(#crimsonGrad)" stroke-width="1.8" />

    <!-- Layer 3 (Inner Core): Data & Cryptographic Fortress -->
    <path d="M 0 -58 C 30 -54 48 -48 60 -36 C 58 4 50 36 0 66 C -50 36 -58 4 -60 -36 C -48 -48 -30 -54 0 -58 Z"
          fill="#0D1322" stroke="url(#amberGrad)" stroke-width="2" />

    <!-- Central Cryptographic Core & Padlock -->
    <!-- Padlock Shackle -->
    <path d="M -11 -6 V -19 C -11 -25 -6 -29 0 -29 C 6 -29 11 -25 11 -19 V -6"
          stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Padlock Body -->
    <rect x="-18" y="-6" width="36" height="30" rx="5" fill="#E11D48" stroke="#FB7185" stroke-width="1.5" />
    <!-- Keyhole -->
    <circle cx="0" cy="5" r="3.5" fill="#FEF08A" filter="url(#softGlow)" />
    <polygon points="-1.8,7 1.8,7 2.8,14 -2.8,14" fill="#FEF08A" />

    <!-- STRIDE Threat Matrix Hexagonal Nodes (Orbiting Defense Grid) -->
    <!-- S - Spoofing -->
    <g transform="translate(-115, -78)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#131A29" stroke="#F43F5E" stroke-width="1.5" />
      <text x="0" y="4" class="tech-mono" font-weight="700" fill="#FDA4AF" text-anchor="middle">S</text>
      <!-- Connected bus line -->
      <line x1="14" y1="8" x2="52" y2="28" stroke="#F43F5E" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    </g>

    <!-- T - Tampering -->
    <g transform="translate(115, -78)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#131A29" stroke="#F59E0B" stroke-width="1.5" />
      <text x="0" y="4" class="tech-mono" font-weight="700" fill="#FEF08A" text-anchor="middle">T</text>
      <line x1="-14" y1="8" x2="-52" y2="28" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    </g>

    <!-- R - Repudiation -->
    <g transform="translate(-142, 10)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#131A29" stroke="#F43F5E" stroke-width="1.5" />
      <text x="0" y="4" class="tech-mono" font-weight="700" fill="#FDA4AF" text-anchor="middle">R</text>
      <line x1="14" y1="0" x2="62" y2="0" stroke="#F43F5E" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    </g>

    <!-- I - Information Disclosure -->
    <g transform="translate(142, 10)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#131A29" stroke="#F59E0B" stroke-width="1.5" />
      <text x="0" y="4" class="tech-mono" font-weight="700" fill="#FEF08A" text-anchor="middle">I</text>
      <line x1="-14" y1="0" x2="-62" y2="0" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    </g>

    <!-- D - Denial of Service -->
    <g transform="translate(-95, 98)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#131A29" stroke="#F43F5E" stroke-width="1.5" />
      <text x="0" y="4" class="tech-mono" font-weight="700" fill="#FDA4AF" text-anchor="middle">D</text>
      <line x1="14" y1="-8" x2="48" y2="-28" stroke="#F43F5E" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    </g>

    <!-- E - Elevation of Privilege -->
    <g transform="translate(95, 98)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#131A29" stroke="#F59E0B" stroke-width="1.5" />
      <text x="0" y="4" class="tech-mono" font-weight="700" fill="#FEF08A" text-anchor="middle">E</text>
      <line x1="-14" y1="-8" x2="-48" y2="-28" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    </g>

    <!-- Defense-in-Depth Ring Callout Tags -->
    <g class="tech-mono">
      <rect x="-44" y="-126" width="88" height="18" rx="4" fill="#0A0E1A" stroke="#64748B" stroke-width="1" />
      <text x="0" y="-113" text-anchor="middle" fill="#CBD5E1">PERIMETER</text>

      <rect x="-40" y="120" width="80" height="18" rx="4" fill="#0A0E1A" stroke="#E11D48" stroke-width="1" />
      <text x="0" y="133" text-anchor="middle" fill="#FDA4AF">ZERO TRUST</text>
    </g>
  </g>
</svg>
