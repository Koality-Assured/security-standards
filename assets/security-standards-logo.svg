<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Dark Carbon Gradient -->
    <linearGradient id="carbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121722" />
      <stop offset="50%" stop-color="#0A0D15" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Titanium Metallic Border Gradient -->
    <linearGradient id="titaniumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.5" />
    </linearGradient>

    <!-- Crimson Shield Gradient (Left Facet) -->
    <linearGradient id="crimsonShieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="60%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <!-- Crimson Shield Gradient (Right Facet - Luminous) -->
    <linearGradient id="crimsonShieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Fiery Amber Core Gradient -->
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Carbon Plate Armor Gradient -->
    <linearGradient id="carbonPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Titanium Steel Metal Bar -->
    <linearGradient id="titaniumMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="crimsonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberAura" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#carbonBg)" stroke="url(#titaniumBorder)" stroke-width="2.5" />

  <!-- Ambient Energy Auras -->
  <circle cx="128" cy="128" r="95" fill="url(#crimsonAura)" />
  <circle cx="128" cy="132" r="62" fill="url(#amberAura)" />

  <!-- Radar Rings & Threat Matrix Grid Coordinates -->
  <g opacity="0.18" stroke="#94A3B8" stroke-width="1">
    <circle cx="128" cy="128" r="102" stroke-dasharray="3 4" />
    <circle cx="128" cy="128" r="76" stroke-dasharray="2 4" />
    <circle cx="128" cy="128" r="46" />
    <line x1="26" y1="128" x2="230" y2="128" stroke-dasharray="3 3" />
    <line x1="128" y1="26" x2="128" y2="230" stroke-dasharray="3 3" />
    <line x1="56" y1="56" x2="72" y2="72" />
    <line x1="200" y1="56" x2="184" y2="72" />
    <line x1="56" y1="200" x2="72" y2="184" />
    <line x1="200" y1="200" x2="184" y2="184" />
  </g>

  <!-- STRIDE Perimeter Hexagonal Threat Nodes -->
  <g id="strideNodes" opacity="0.85">
    <!-- Node S: Spoofing (Top Left) -->
    <g transform="translate(56, 54)">
      <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#1E293B" stroke="#F43F5E" stroke-width="1.2" />
      <text x="0" y="3.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FDA4AF" text-anchor="middle">S</text>
    </g>

    <!-- Node T: Tampering (Middle Left) -->
    <g transform="translate(36, 128)">
      <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <text x="0" y="3.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FDE68A" text-anchor="middle">T</text>
    </g>

    <!-- Node R: Repudiation (Bottom Left) -->
    <g transform="translate(56, 202)">
      <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#1E293B" stroke="#F43F5E" stroke-width="1.2" />
      <text x="0" y="3.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FDA4AF" text-anchor="middle">R</text>
    </g>

    <!-- Node I: Information Disclosure (Top Right) -->
    <g transform="translate(200, 54)">
      <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <text x="0" y="3.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FDE68A" text-anchor="middle">I</text>
    </g>

    <!-- Node D: Denial of Service (Middle Right) -->
    <g transform="translate(220, 128)">
      <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#1E293B" stroke="#F43F5E" stroke-width="1.2" />
      <text x="0" y="3.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FDA4AF" text-anchor="middle">D</text>
    </g>

    <!-- Node E: Elevation of Privilege (Bottom Right) -->
    <g transform="translate(200, 202)">
      <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <text x="0" y="3.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#FDE68A" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Cybersecurity Armor Shield (Outer Frame) -->
  <path d="M 128 42 C 102 48 76 53 58 62 C 55 106 54 150 128 214 C 202 150 201 106 198 62 C 180 53 154 48 128 42 Z"
        fill="#0B0F19" stroke="url(#titaniumBorder)" stroke-width="3" stroke-linejoin="round" />

  <!-- Shield Facets (Left: Dark Ruby Armor Plate, Right: Radiant Crimson Plate) -->
  <path d="M 128 48 C 105 53 82 58 66 66 C 64 104 63 143 128 202 L 128 48 Z"
        fill="url(#crimsonShieldLeft)" />
  <path d="M 128 48 C 151 53 174 58 190 66 C 192 104 193 143 128 202 L 128 48 Z"
        fill="url(#crimsonShieldRight)" />

  <!-- Inner Carbon Core Armor Plate -->
  <path d="M 128 62 C 110 66 92 70 80 77 C 78 108 77 138 128 186 C 179 138 178 108 176 77 C 164 70 146 66 128 62 Z"
        fill="url(#carbonPlate)" stroke="#334155" stroke-width="1.5" />

  <!-- Cryptographic Circuit & Mesh Bus Lines -->
  <g stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Top bus lines connecting shackle -->
    <path d="M 104 94 L 92 84 L 84 84" />
    <path d="M 152 94 L 164 84 L 172 84" />
    <!-- Lateral traces -->
    <path d="M 94 136 L 82 136 L 76 142" />
    <path d="M 162 136 L 174 136 L 180 142" />
    <!-- Lower convergent traces -->
    <path d="M 112 164 L 102 174 L 102 180" />
    <path d="M 144 164 L 154 174 L 154 180" />
  </g>

  <!-- Bus Line Circuit Nodes -->
  <g fill="#FBBF24">
    <circle cx="84" cy="84" r="2.2" />
    <circle cx="172" cy="84" r="2.2" />
    <circle cx="76" cy="142" r="2.2" />
    <circle cx="180" cy="142" r="2.2" />
    <circle cx="102" cy="180" r="2.2" />
    <circle cx="154" cy="180" r="2.2" />
  </g>

  <!-- Cryptographic Padlock & Cipher Core -->
  <g id="cryptographicPadlock">
    <!-- Padlock Hardened Shackle (Arch) -->
    <path d="M 114 116 V 101 C 114 93.2 120.3 87 128 87 C 135.7 87 142 93.2 142 101 V 116"
          stroke="url(#titaniumMetal)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <path d="M 114 116 V 101 C 114 93.2 120.3 87 128 87 C 135.7 87 142 93.2 142 101 V 116"
          stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Padlock Body (Titanium Body with Amber Glowing Inset) -->
    <rect x="104" y="114" width="48" height="42" rx="7" fill="#0F172A" stroke="url(#titaniumMetal)" stroke-width="2" />
    <rect x="108" y="118" width="40" height="34" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5" />

    <!-- Radiant Keyhole Core -->
    <g filter="url(#amberGlow)">
      <!-- Keyhole Head Circle -->
      <circle cx="128" cy="130" r="5" fill="url(#amberCore)" />
      <!-- Keyhole Stem -->
      <polygon points="125.5,133 130.5,133 132.5,144 123.5,144" fill="url(#amberCore)" />
    </g>

    <!-- Shackle Interlock Indicator Lights -->
    <circle cx="112" cy="120" r="1.5" fill="#34D399" />
    <circle cx="144" cy="120" r="1.5" fill="#34D399" />
  </g>

  <!-- Top Center Armor Crest Spike -->
  <polygon points="128,34 133,43 128,45 123,43" fill="#E11D48" filter="url(#crimsonGlow)" />
  <circle cx="128" cy="38" r="1.5" fill="#FFF1F2" />
</svg>
